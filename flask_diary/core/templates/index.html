<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Appointments for {{ today.strftime('%Y-%m-%d') }}</h1>
    {% if events %}
        <ul class="list-group">
            {% for event in events %}
                <li class="list-group-item">
                    <strong>{{ event.start }}</strong> - {{ event.summary }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No events found.</p>
    {% endif %}
</div>
</body>
</html>
